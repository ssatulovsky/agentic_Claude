# Entorno local de desarrollo. NO usar estas claves fuera de su computador.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_local
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ./db/bootstrap.sql:/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  datos_pg:
