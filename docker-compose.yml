# Entorno local de desarrollo. NO usar estas claves fuera de su computador.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_local
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ./db/bootstrap.sql:/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # Transcripción local de notas de voz (Whisper, compatible con /v1/audio/transcriptions).
  # Se levanta solo si se pide: docker compose --profile voz up -d transcripcion
  # El audio no sale del servidor. Configure en el ERP:
  #   TRANSCRIPCION_URL=http://localhost:8000  TRANSCRIPCION_MODELO=Systran/faster-whisper-small
  transcripcion:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    profiles: ["voz"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      ENABLE_UI: "false"
      STT_MODEL_TTL: "-1"
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
    volumes:
      - modelos_whisper:/home/ubuntu/.cache/huggingface/hub

volumes:
  datos_pg:
  modelos_whisper:
